services:
  - type: web
    name: electrochico-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Sem isto o Stripe devolve o cliente a http://localhost:3001 depois de
      # pagar. Fica com valor literal (e não sync: false) para não depender de
      # alguém se lembrar de o preencher no painel.
      - key: WEB_ORIGIN
        value: https://electro-chico.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
