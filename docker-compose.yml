services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: electrochico
      POSTGRES_PASSWORD: electrochico_dev
      POSTGRES_DB: electrochico
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
